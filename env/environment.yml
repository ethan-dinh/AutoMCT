name: microct-analysis
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  # Core scientific stack
  - numpy
  - scipy
  - scikit-image
  - tifffile
  - networkx
  - plotly
  - tqdm
  - pillow
  - matplotlib
  - numba
  # CLI / TUI utilities
  - rich
  # Interactive menus in segment_mandible/tests/test_pipeline.py
  - questionary
  # Visualization
  - napari
  - pyqt6
  # Tk ships with conda's Python on all platforms; pinned explicitly because
  # segment_mandible/tests/run.py imports tkinter for its native file pickers.
  - tk
  # Build tools
  - pip
  - pip:
      # NRRD file I/O
      - pynrrd
      # DICOM reading (used by tools/convert_DICOM_NRRD.py)
      - pydicom>=2.4
      # Speeds up napari's OpenGL rendering (optional but recommended)
      - PyOpenGL-accelerate
      # Deep learning (ML-Segmentation module)
      # For GPU support, install PyTorch separately — see env/README.md
      - torch>=2.0
      - monai>=1.3
